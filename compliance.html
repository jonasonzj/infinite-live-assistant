<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>合规知识库 - 直播运营助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0056b3',
                        secondary: '#ff6b00',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto { content-visibility: auto; }
            .bg-gradient-primary { background: linear-gradient(180deg, #0056b3 0%, #004494 100%); }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- 左侧导航栏 -->
        <aside class="bg-gradient-primary text-white w-64 flex-shrink-0 hidden md:block">
            <div class="p-4 flex items-center space-x-2">
                <h1 class="text-xl font-bold">直播运营助手</h1>
            </div>
            <nav class="mt-6">
                <ul>
                    <li>
                        <a href="index.html" class="flex items-center px-4 py-3 hover:bg-white hover:bg-opacity-20 transition-all-300">
                            <i class="fa fa-home w-6"></i><span>首页</span>
                        </a>
                    </li>
                    <li>
                        <a href="compliance.html" class="flex items-center px-4 py-3 bg-white bg-opacity-20 transition-all-300">
                            <i class="fa fa-book w-6"></i><span>合规知识库</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- 主内容区 -->
        <main class="flex-1 overflow-y-auto bg-gray-50 p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold text-gray-800">合规知识库</h2>
            </div>

            <!-- 分类筛选 -->
            <div class="bg-white rounded-lg shadow-sm p-4 mb-6">
                <button class="px-4 py-2 bg-primary text-white rounded-md mr-2">全部</button>
                <button class="px-4 py-2 bg-white border border-gray-300 rounded-md mx-1">公司规范</button>
                <button class="px-4 py-2 bg-white border border-gray-300 rounded-md mx-1">行业法规</button>
                <button class="px-4 py-2 bg-white border border-gray-300 rounded-md mx-1">违禁词库</button>
            </div>

            <!-- 知识卡片 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <div class="bg-white rounded-lg shadow-sm p-5 hover:shadow-md transition-all">
                    <h4 class="font-semibold text-gray-800">保健品直播营销10项禁令</h4>
                    <p class="text-sm text-gray-600 mt-2">禁止宣称治疗效果、禁止使用医疗术语、禁止夸大宣传</p>
                    <div class="mt-3 text-xs text-gray-500">更新时间：2026-04-01</div>
                </div>

                <div class="bg-white rounded-lg shadow-sm p-5 hover:shadow-md transition-all">
                    <h4 class="font-semibold text-gray-800">直播内容合规规范</h4>
                    <p class="text-sm text-gray-600 mt-2">着装规范、语言规范、行为规范、场景规范要求</p>
                    <div class="mt-3 text-xs text-gray-500">更新时间：2026-04-01</div>
                </div>

                <div class="bg-white rounded-lg shadow-sm p-5 hover:shadow-md transition-all">
                    <h4 class="font-semibold text-gray-800">广告法违禁词汇总</h4>
                    <p class="text-sm text-gray-600 mt-2">国家级、最高级、第一、特效等绝对化用语禁止使用</p>
                    <div class="mt-3 text-xs text-gray-500">更新时间：2026-04-01</div>
                </div>
            </div>
        </main>

        <!-- 右侧团队信息 -->
        <aside class="w-80 bg-white border-l border-gray-200 p-6 overflow-y-auto hidden lg:block">
            <div class="flex items-center mb-6">
                <div class="w-12 h-12 rounded-full bg-primary flex items-center justify-center text-white font-bold text-xl">
                    <i class="fa fa-users"></i>
                </div>
                <div class="ml-4">
                    <h4 class="font-semibold text-gray-800">直播运营团队</h4>
                    <p class="text-sm text-gray-500">合规运营支持</p>
                </div>
            </div>

            <div class="mb-6">
                <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-3">合规小贴士</h3>
                <ul class="space-y-2 text-sm text-gray-700">
                    <li>• 直播前必须审核素材</li>
                    <li>• 严禁使用医疗术语</li>
                    <li>• 禁止夸大产品功效</li>
                </ul>
            </div>
        </aside>
    </div>
</body>
</html>
